<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(주)비에이텍 - 워터펌프 전문기업</title>
    <style>
        /* 기존 스타일 유지 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; color: #333; line-height: 1.6; }
        
        /* [추가된 스타일] 자료실 섹션 */
        .content-section {
            padding: 80px 5%;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        .content-title {
            font-size: 2rem;
            color: #0056b3;
            margin-bottom: 40px;
        }
        .pdf-container {
            width: 100%;
            height: 800px; /* 화면에 보여질 높이 */
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }
        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 25px;
            border: 2px solid #0056b3;
            background: #fff;
            color: #0056b3;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #0056b3;
            color: #fff;
        }
        
        /* 기존 사이드바 스타일 유지 */
        .side-campaign-bar { position: fixed; right: 25px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; z-index: 9999; }
        .side-icon { width: 80px; height: 80px; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s ease; text-align: center; cursor: pointer; }
        .campaign-icon { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .brochure-icon { background: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #6FB1FC 100%); }
    </style>
</head>
<body>

    <section id="library" class="content-section">
        <h3 class="content-title">자료실</h3>
        <div class="tab-menu">
            <button class="tab-btn active" onclick="changeContent('pdf/water.pdf.pdf', this)">물 활용 캠페인</button>
            <button class="tab-btn" onclick="changeContent('pdf/Brochure.pdf.pdf', this)">기업 브로슈어</button>
        </div>
        
        <div class="pdf-container">
            <embed id="main-viewer" src="pdf/water.pdf.pdf" type="application/pdf" width="100%" height="100%" />
        </div>
    </section>

    <div class="side-campaign-bar">
        <div onclick="goToLibrary('pdf/water.pdf.pdf', 0)" class="side-icon campaign-icon">캠페인<br>보기</div>
        <div onclick="goToLibrary('pdf/Brochure.pdf.pdf', 1)" class="side-icon brochure-icon">브로슈어<br>보기</div>
    </div>
